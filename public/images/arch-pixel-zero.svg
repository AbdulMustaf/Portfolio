<text x="461.5" y="340.0" font-size="23" fill="#ececf2" font-weight="bold" text-anchor="start">Async fingerprint queue</text>
<text x="461.5" y="370.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">dedupe · throttle · retry</text>
<rect x="443.5" y="410.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="461.5" y="452.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">Flask API</text>
<text x="461.5" y="482.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">/analyze endpoint</text>
<rect x="443.5" y="522.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="461.5" y="564.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">Response normalizer</text>
<text x="461.5" y="594.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">providers → one score</text>
<line x1="783.0" y1="458.0" x2="817.0" y2="458.0" stroke="#5a5a66" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="832.0" cy="194" r="5" fill="#e50914"/>
<text x="847.0" y="201.0" font-size="22" fill="#ececf2" font-weight="bold" text-anchor="start" letter-spacing="2.5">DETECTORS</text>
<rect x="827.0" y="298.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="845.0" y="340.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">Gemini API</text>
<text x="845.0" y="370.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">vision-model reasoning</text>
<rect x="827.0" y="410.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="845.0" y="452.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">AI-or-Not API</text>
<text x="845.0" y="482.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">synthetic-media classifier</text>
<rect x="827.0" y="522.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#e50914" stroke-width="2"/>
<rect x="827.0" y="522.0" width="4" height="96.0" rx="2" fill="#e50914"/>
