<rect x="60.0" y="298.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#e50914" stroke-width="2"/>
<rect x="60.0" y="298.0" width="4" height="96.0" rx="2" fill="#e50914"/>
<text x="84.0" y="340.0" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="start">riskRail.js</text>
