<text x="78.0" y="482.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">watches the feed DOM</text>
<rect x="60.0" y="522.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="78.0" y="564.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">Image harvester</text>
<text x="78.0" y="594.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">srcset → candidate list</text>
<line x1="399.5" y1="458.0" x2="433.5" y2="458.0" stroke="#5a5a66" stroke-width="3" marker-end="url(#arrow)"/>
