<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="A Chrome content script watches the feed DOM, queues images through a Flask API to Gemini and AI-or-Not, and maps normalized confidence scores back onto the live DOM nodes as risk badges and blur layers.">
<title>A Chrome content script watches the feed DOM, queues images through a Flask API to Gemini and AI-or-Not, and maps normalized confidence scores back onto the live DOM nodes as risk badges and blur layers.</title>
<defs>
<radialGradient id="glow" cx="12%" cy="6%" r="70%">
<stop offset="0%" stop-color="#e50914" stop-opacity="0.10"/>
<stop offset="100%" stop-color="#e50914" stop-opacity="0"/>
</radialGradient>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#5a5a66"/>
</marker>
</defs>
<rect width="1600" height="900" fill="#0f0f12"/>
<rect width="1600" height="900" fill="url(#glow)"/>
