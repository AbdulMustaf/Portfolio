<text x="851.0" y="594.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">score → risk tier</text>
<line x1="1166.5" y1="458.0" x2="1200.5" y2="458.0" stroke="#5a5a66" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="1215.5" cy="194" r="5" fill="#e50914"/>
<text x="1230.5" y="201.0" font-size="22" fill="#ececf2" font-weight="bold" text-anchor="start" letter-spacing="2.5">OVERLAY</text>
<rect x="1210.5" y="298.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#e50914" stroke-width="2"/>
<rect x="1210.5" y="298.0" width="4" height="96.0" rx="2" fill="#e50914"/>
<text x="1234.5" y="340.0" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="start">Risk badge</text>
<text x="1234.5" y="370.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">bound to the live DOM node</text>
<rect x="1210.5" y="410.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="1228.5" y="452.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">NSFW blur layer</text>
<text x="1228.5" y="482.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">opt-in reveal</text>
<rect x="1210.5" y="522.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="1228.5" y="564.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">Lasso tool</text>
<text x="1228.5" y="594.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">verify a region on demand</text>
<rect x="60" y="700" width="1480" height="58" rx="10" fill="none" stroke="#e50914" stroke-width="2" stroke-dasharray="10 8" opacity="0.75"/>
<text x="800.0" y="737.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="middle">The digital trust gap — verification has to happen where the image is seen, at feed scroll speed, without asking the user to leave the page</text>
<line x1="60" y1="784" x2="1540" y2="784" stroke="#2f2f3a" stroke-width="2"/>
<text x="245.0" y="840.0" font-size="46" fill="#e50914" font-weight="bold" text-anchor="middle">QHacks</text>
