<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Two-part research pipeline: wearable kinematics feed a four-class phase detector, whose labels are then re-segmented on velocity gates to build a prespecified movement-control index.">
<title>Two-part research pipeline: wearable kinematics feed a four-class phase detector, whose labels are then re-segmented on velocity gates to build a prespecified movement-control index.</title>
