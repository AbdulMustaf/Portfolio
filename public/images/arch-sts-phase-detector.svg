<text x="845.0" y="541.0" font-size="22" fill="#ececf2" font-weight="bold" text-anchor="start">validate_real_labels</text>
<text x="845.0" y="568.0" font-size="17" fill="#8b8b96" font-weight="normal" text-anchor="start">known-groups + permutation</text>
