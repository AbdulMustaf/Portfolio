<text x="78.0" y="564.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">Constraint scan</text>
<text x="78.0" y="594.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">policy · access · legacy</text>
