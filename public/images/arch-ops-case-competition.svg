<text x="845.0" y="284.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">Eligibility rules</text>
<text x="845.0" y="314.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">policy encoded once</text>
<rect x="827.0" y="354.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
