<text x="845.0" y="426.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">to the owning program</text>
<rect x="827.0" y="466.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="845.0" y="508.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">Records of authority</text>
<text x="845.0" y="538.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">ministry systems of record</text>
<rect x="827.0" y="578.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="845.0" y="620.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">Audit + reporting</text>
<text x="845.0" y="650.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">service metrics by default</text>
