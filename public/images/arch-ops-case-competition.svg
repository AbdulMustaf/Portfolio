<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="A service blueprint: research findings drive a frontstage citizen intake layer, backed by backstage eligibility, routing and ministry systems of record, then validated with usability testing and a stakeholder pitch.">
<title>A service blueprint: research findings drive a frontstage citizen intake layer, backed by backstage eligibility, routing and ministry systems of record, then validated with usability testing and a stakeholder pitch.</title>
<defs>
