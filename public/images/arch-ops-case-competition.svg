<text x="800.0" y="840.0" font-size="46" fill="#e50914" font-weight="bold" text-anchor="middle">4</text>
<text x="800.0" y="872.0" font-size="20" fill="#8b8b96" font-weight="normal" text-anchor="middle">research-to-pitch stages</text>
<text x="1293.3" y="840.0" font-size="46" fill="#e50914" font-weight="bold" text-anchor="middle">AODA</text>
