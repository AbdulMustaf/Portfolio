<rect x="1210.5" y="522.0" width="4" height="96.0" rx="2" fill="#e50914"/>
<text x="1234.5" y="564.0" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="start">Stakeholder pitch</text>
<text x="1234.5" y="594.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">senior OPS leadership</text>
<rect x="60" y="700" width="1480" height="58" rx="10" fill="none" stroke="#e50914" stroke-width="2" stroke-dasharray="10 8" opacity="0.75"/>
<text x="800.0" y="737.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="middle">Human-centred design loop — every backstage decision traces to a frontstage failure observed in research, then gets re-tested with citizens</text>
