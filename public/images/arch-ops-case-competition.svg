<text x="1228.5" y="370.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">iterate on real tasks</text>
<rect x="1210.5" y="410.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
