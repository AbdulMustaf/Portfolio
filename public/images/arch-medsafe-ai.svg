<circle cx="65.0" cy="194" r="5" fill="#e50914"/>
<text x="80.0" y="201.0" font-size="22" fill="#ececf2" font-weight="bold" text-anchor="start" letter-spacing="2.5">CAPTURE</text>
<rect x="60.0" y="298.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="78.0" y="340.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">Ward IP cameras</text>
<text x="78.0" y="370.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">RTSP video frames</text>
<rect x="60.0" y="410.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="78.0" y="452.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">Ambient microphones</text>
<text x="78.0" y="482.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">streaming audio buffers</text>
<rect x="60.0" y="522.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="78.0" y="564.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">Training corpus</text>
<text x="78.0" y="594.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">5,000+ video + audio samples</text>
