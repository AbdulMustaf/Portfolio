<text x="461.5" y="370.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">decode · resize · sample</text>
<rect x="443.5" y="410.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="461.5" y="452.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">YOLO detection</text>
<text x="461.5" y="482.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">people · poses · objects</text>
<rect x="443.5" y="522.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="461.5" y="564.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">TensorFlow audio</text>
<text x="461.5" y="594.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">distress / shout classes</text>
<line x1="783.0" y1="458.0" x2="817.0" y2="458.0" stroke="#5a5a66" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="832.0" cy="194" r="5" fill="#e50914"/>
<text x="847.0" y="201.0" font-size="22" fill="#ececf2" font-weight="bold" text-anchor="start" letter-spacing="2.5">DECISION</text>
<rect x="827.0" y="298.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#e50914" stroke-width="2"/>
<rect x="827.0" y="298.0" width="4" height="96.0" rx="2" fill="#e50914"/>
<text x="851.0" y="340.0" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="start">Aggression classifier</text>
<text x="851.0" y="370.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">fuses vision + audio</text>
<rect x="827.0" y="410.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="845.0" y="452.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">Temporal smoothing</text>
<text x="845.0" y="482.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">kills single-frame spikes</text>
<rect x="827.0" y="522.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="845.0" y="564.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">Threshold + severity</text>
<text x="845.0" y="594.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">confidence → alert tier</text>
<line x1="1166.5" y1="458.0" x2="1200.5" y2="458.0" stroke="#5a5a66" stroke-width="3" marker-end="url(#arrow)"/>
<circle cx="1215.5" cy="194" r="5" fill="#e50914"/>
