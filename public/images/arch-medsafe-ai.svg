<rect x="1210.5" y="242.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="1228.5" y="284.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">.NET (C#) service</text>
<text x="1228.5" y="314.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">incident API + dispatch</text>
<rect x="1210.5" y="354.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#e50914" stroke-width="2"/>
<rect x="1210.5" y="354.0" width="4" height="96.0" rx="2" fill="#e50914"/>
<text x="1234.5" y="396.0" font-size="24" fill="#ffffff" font-weight="bold" text-anchor="start">Angular dashboard</text>
<text x="1234.5" y="426.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">live feed · alert queue</text>
<rect x="1210.5" y="466.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="1228.5" y="508.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">PostgreSQL store</text>
<text x="1228.5" y="538.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">incidents, not identities</text>
<rect x="1210.5" y="578.0" width="329.5" height="96.0" rx="10" fill="#1b1b21" stroke="#2f2f3a" stroke-width="2"/>
<text x="1228.5" y="620.0" font-size="24" fill="#ececf2" font-weight="bold" text-anchor="start">Security staff alert</text>
<text x="1228.5" y="650.0" font-size="19" fill="#8b8b96" font-weight="normal" text-anchor="start">pushed in real time</text>
<rect x="60" y="700" width="1480" height="58" rx="10" fill="none" stroke="#e50914" stroke-width="2" stroke-dasharray="10 8" opacity="0.75"/>
<text x="800.0" y="737.0" font-size="15" fill="#8b8b96" font-weight="normal" text-anchor="middle">Privacy by design — classifies actions, never identifies individuals · no personal identifiers stored · encrypted in transit · bias and explainability treated as requirements</text>
<line x1="60" y1="784" x2="1540" y2="784" stroke="#2f2f3a" stroke-width="2"/>
<text x="245.0" y="840.0" font-size="46" fill="#e50914" font-weight="bold" text-anchor="middle">~20%</text>
<text x="245.0" y="872.0" font-size="20" fill="#8b8b96" font-weight="normal" text-anchor="middle">accuracy over baseline</text>
<text x="615.0" y="840.0" font-size="46" fill="#e50914" font-weight="bold" text-anchor="middle">5,000+</text>
<text x="615.0" y="872.0" font-size="20" fill="#8b8b96" font-weight="normal" text-anchor="middle">training samples</text>
<text x="985.0" y="840.0" font-size="46" fill="#e50914" font-weight="bold" text-anchor="middle">1 in 5</text>
<text x="985.0" y="872.0" font-size="20" fill="#8b8b96" font-weight="normal" text-anchor="middle">health workers affected</text>
<text x="1355.0" y="840.0" font-size="46" fill="#e50914" font-weight="bold" text-anchor="middle">$2,000</text>
<text x="1355.0" y="872.0" font-size="20" fill="#8b8b96" font-weight="normal" text-anchor="middle">Catalyst Challenge win</text>
