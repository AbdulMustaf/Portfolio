<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-label="Ward cameras and microphones feed a YOLO and TensorFlow perception layer; a fusion classifier scores aggression and a .NET service pushes alerts to an Angular monitoring dashboard.">
<title>Ward cameras and microphones feed a YOLO and TensorFlow perception layer; a fusion classifier scores aggression and a .NET service pushes alerts to an Angular monitoring dashboard.</title>
<defs>
<radialGradient id="glow" cx="12%" cy="6%" r="70%">
